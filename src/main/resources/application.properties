# 로컬 개발: 프로젝트 폴더의 .env(KEY=VALUE)가 있으면 읽는다. 운영에서는 실제 환경변수를 쓴다.
spring.config.import=optional:file:.env[.properties]

server.port=8083

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# DB 접속 정보 — 환경변수로 주입 (비밀번호는 기본값 없음: 비어 있으면 기동 시 접속 오류로 바로 알 수 있음)
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ecotvy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ?? ?? ??
logging.level.org.springframework=info
logging.level.com.springbootstart=info

resource.path=file:/C:/upload/
upload.path=/upload/**

spring.profiles.active=local
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.mvc.servlet.path=/
spring.mvc.static-path-pattern=/static/**
spring.mvc.hidden-method.filter.enabled=true



spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=1000
# 운영에서는 DB_DDL_AUTO=validate (또는 none) 권장 — update는 컬럼 삭제·제약 변경을 반영하지 못하고 의도치 않게 스키마를 바꿀 수 있음
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.location=C://upload

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# 메일(SMTP) — 값은 모두 환경변수로 주입한다. 이 파일에 계정·비밀번호를 적지 말 것.
# MAIL_HOST를 비워 두면 메일 기능이 꺼진다 (서버는 정상 기동, 재설정 메일만 발송되지 않음)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.connection-timeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.write-timeout=5000
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS:true}
# 보내는 사람 주소 (비우면 MAIL_USERNAME)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@ecotvy.local}}
spring.mail.auth-code-expiration-millis=1800000

# 비밀번호 재설정 메일
# 메일 링크가 가리킬 프론트엔드 주소 (운영에서는 실제 도메인)
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
# 링크 유효시간 / 같은 이메일 재요청 간격
app.password-reset.ttl=30m
app.password-reset.cooldown=60s


# 첫 관리자 지정: 관리자가 한 명도 없을 때만, 이미 가입한 이 이메일 계정을 서버 시작 시 ADMIN으로 올린다
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# AWS S3 Configuration
# 환경(로컬/스테이징/운영)마다 다른 값은 환경변수로. 자격 증명은 AWS SDK가 AWS_ACCESS_KEY_ID 등 또는 IAM 역할에서 직접 읽는다
aws.s3.bucket-name=${AWS_S3_BUCKET:ecotvy-images}
aws.s3.region=${AWS_REGION:ap-northeast-2}
# S3 호환 저장소(MinIO 등)를 쓸 때만 지정. 비워 두면 AWS S3 (예: http://localhost:9000)
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
# API 응답의 이미지 URL은 이 시간 동안만 유효한 서명 URL로 내려간다 (버킷은 비공개로 유지). 최대 7d
aws.s3.presigned-url-ttl=${AWS_S3_PRESIGNED_URL_TTL:1h}

# AI Model Server Configuration
ai.model.server.url=http://localhost:8000
ai.model.timeout=1500

# JWT Configuration
# 서명 키는 반드시 환경변수 JWT_SECRET으로 주입 (32바이트 이상, 예: openssl rand -base64 48)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=1800000

# CORS Configuration (쉼표로 여러 개 지정, 운영 시 실제 프론트엔드 도메인으로 교체)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
